[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeowners-lint"
version = "0.1.0"
description = "Lint GitHub CODEOWNERS files for blank lines, duplicates, invalid patterns, missing ownership, and path ordering."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Henry-Samuel"}]
keywords = ["codeowners", "lint", "github", "cli", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
codeowners-lint = "codeowners_lint:main"

[tool.setuptools]
py-modules = ["codeowners_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [".github"]
