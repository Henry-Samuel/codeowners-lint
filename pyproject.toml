[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeowners-lint"
version = "0.1.0"
description = "Lint GitHub CODEOWNERS files for empty lines, invalid patterns, missing ownership, duplicates, and path ordering."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "ProjectCreationAgent"}]
keywords = ["codeowners", "lint", "github"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codeowners-lint = "codeowners_lint:main"

[tool.setuptools]
py-modules = ["codeowners_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
